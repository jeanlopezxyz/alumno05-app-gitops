# Rompe la API a propósito para probar la alerta y la notificación: una imagen
# que no existe y un plazo de progreso corto (60 s en lugar de 600 s), para que
# el Deployment pase de Progressing a Degraded en un minuto.
# https://argo-cd.readthedocs.io/en/stable/operator-manual/health/#deployment-replicaset-statefulset-daemonset
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-api
spec:
  progressDeadlineSeconds: 60
  template:
    spec:
      containers:
        - name: api
          image: ghcr.io/jeanlopezxyz/catalogo-api:0.0.0-no-existe
